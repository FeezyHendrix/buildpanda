server {
    # ${PORT} is rendered by the nginx image's envsubst entrypoint; see
    # packages/frontend/nginx.conf for why the port and the IPv6 listen matter.
    listen ${PORT};
    listen [::]:${PORT};
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # expo export writes content-hashed bundles and assets.
    location /_expo/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page output: every route is served by index.html and Expo Router
    # resolves it in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

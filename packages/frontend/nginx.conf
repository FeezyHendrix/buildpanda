server {
    # Rendered by the nginx image's envsubst entrypoint — see the Dockerfile.
    # ${PORT} is assigned by the platform at runtime and nginx cannot read env
    # vars from its own config, so a hardcoded port silently strands the whole
    # site behind a 502 while the container itself looks perfectly healthy.
    #
    # The IPv6 line matters just as much: the platform edge connects over IPv6,
    # and the image's 10-listen-on-ipv6-by-default.sh only patches the config it
    # ships, never this one.
    listen ${PORT};
    listen [::]:${PORT};
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are content-addressed and immutable. Cache hard, and
    # return a real 404 for a missing file (do NOT fall back to index.html) so a
    # stale chunk request fails fast instead of receiving HTML — which is what
    # triggers "Failed to fetch dynamically imported module".
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the SPA entry, so a new deploy's chunk hashes are picked up
    # immediately rather than the browser reusing a stale index.html.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

name: Shared code in step

# packages/shared is copied into the web app, the mobile app and the backend
# (scripts/sync-shared.mjs). This fails when a copy was edited directly.
on:
  push:
    branches: [master, prod]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-shared.mjs --check

name: Release APK

# prod is the production branch, master is staging. EXPO_PUBLIC_API_URL is
# inlined into the JS bundle at build time, so the API origin is a property of
# the build and cannot be changed on an installed app.
#
# Each push generates the native Android project with expo prebuild and builds
# the release APK with Gradle on the runner — no EAS. Signing: when the
# ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS /
# ANDROID_KEY_PASSWORD secrets are set the APK is signed with that release
# keystore; without them it falls back to the debug keystore (installable for
# internal testing, not Play-uploadable).
on:
  push:
    branches: [master, prod]
  workflow_dispatch:

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mobile
    env:
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"
      EXPO_NO_TELEMETRY: "1"
      # Only prod gets the production API. master and any manual dispatch fall
      # to staging, so a build off an unexpected ref can never ship against prod.
      EXPO_PUBLIC_API_URL: ${{ github.ref == 'refs/heads/prod' && 'https://api.buildpanda.io' || 'https://api.staging.buildpanda.io' }}
      ENVIRONMENT_NAME: ${{ github.ref == 'refs/heads/prod' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      # packages/mobile/.env is gitignored, so without this the bundler would
      # inline the localhost fallback and ship an APK that reaches no backend.
      - name: Check the API base URL is set
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "EXPO_PUBLIC_API_URL is empty — refusing to build a bundle with no backend." >&2
            exit 1
          fi
          echo "Building the $ENVIRONMENT_NAME APK against $EXPO_PUBLIC_API_URL"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No release keystore secret — building with the debug keystore."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          node --eval '
            const fs = require("fs");
            const path = "android/app/build.gradle";
            let gradle = fs.readFileSync(path, "utf8");
            const releaseConfig = [
              "signingConfigs {",
              "        release {",
              "            storeFile file(\"release.keystore\")",
              "            storePassword System.getenv(\"ANDROID_KEYSTORE_PASSWORD\")",
              "            keyAlias System.getenv(\"ANDROID_KEY_ALIAS\")",
              "            keyPassword System.getenv(\"ANDROID_KEY_PASSWORD\")",
              "        }",
            ].join("\n");
            if (!gradle.includes("signingConfigs {")) throw new Error("signingConfigs anchor missing");
            gradle = gradle.replace("signingConfigs {", releaseConfig);
            const anchor = "signingConfig signingConfigs.debug";
            const last = gradle.lastIndexOf(anchor);
            if (last < 0) throw new Error("release signingConfig anchor missing");
            gradle = gradle.slice(0, last) + "signingConfig signingConfigs.release" + gradle.slice(last + anchor.length);
            fs.writeFileSync(path, gradle);
          '
          grep -n "signingConfigs.release" android/app/build.gradle

      - name: Build release APK
        working-directory: packages/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.jvmargs=-Xmx4g
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk buildpanda-field.apk

      - uses: actions/upload-artifact@v4
        with:
          name: buildpanda-field-apk-${{ env.ENVIRONMENT_NAME }}
          path: packages/mobile/buildpanda-field.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$ENVIRONMENT_NAME" = "production" ]; then
            TAG="apk-${{ github.run_number }}"
            TITLE="BuildPanda Field APK #${{ github.run_number }}"
            PRERELEASE=""
          else
            TAG="apk-staging-${{ github.run_number }}"
            TITLE="BuildPanda Field APK #${{ github.run_number }} (Staging)"
            PRERELEASE="--prerelease"
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "Release APK built from ${{ github.ref_name }} @ ${{ github.sha }} against $EXPO_PUBLIC_API_URL" \
            $PRERELEASE \
            buildpanda-field.apk
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      # Each APK is ~120MB. Keep the one just published and drop the two before
      # it, matched within this channel only so a staging build can never delete
      # a production release.
      - name: Prune the previous two releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$ENVIRONMENT_NAME" = "production" ]; then
            PATTERN='^apk-[0-9]+$'
          else
            PATTERN='^apk-staging-[0-9]+$'
          fi

          # Sorted on publishedAt, not createdAt: createdAt is the target commit's
          # date, so two releases built from one commit tie and order arbitrarily.
          gh release list --repo "${{ github.repository }}" --limit 100 \
            --json tagName,publishedAt \
            --jq 'sort_by(.publishedAt) | reverse | .[].tagName' \
            | grep -E "$PATTERN" \
            | grep -vx "$RELEASE_TAG" \
            | head -n 2 \
            | while read -r old; do
                echo "Deleting $old"
                gh release delete "$old" --repo "${{ github.repository }}" --cleanup-tag --yes
              done

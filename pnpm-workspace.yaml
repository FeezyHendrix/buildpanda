# Security patches for transitive dependencies (pnpm audit, 2026-10-26). Each
# stays on the major the dependant already resolves, so nothing changes API.
# Left alone because the fix is a breaking major or none exists: uuid, esbuild
# (drizzle-kit's esbuild-kit), postcss-selector-parser (tailwind 3),
# decode-uri-component, image-size, tough-cookie and request (xeokit-convert),
# node-forge, xlsx.
